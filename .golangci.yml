version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - bodyclose
    - errorlint
    - nilerr
    - revive
  settings:
    revive:
      rules:
        - name: var-naming
        - name: unused-parameter
          disabled: true
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
