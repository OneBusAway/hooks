{{define "login"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — hooks inspector</title>
<link rel="stylesheet" href="/inspector/static/style.css">
</head>
<body class="centered">
<form method="post" action="/inspector/login" class="login">
  <h1>hooks inspector</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <label>Admin token <input type="password" name="token" autofocus required></label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>{{end}}
