{{define "login"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — hooks</title>
<link rel="stylesheet" href="/inspector/static/style.css">
</head>
<body class="centered">
<form method="post" action="/login{{if .Next}}?next={{.Next}}{{end}}" class="login">
  <h1>Sign in</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label>Email <input type="email" name="email" autocomplete="username" autofocus required value="{{.Email}}"></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>{{end}}
