{{define "device_done"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Device {{.Action}} — hooks</title>
<link rel="stylesheet" href="/inspector/static/style.css">
</head>
<body class="centered">
<div class="login">
  <h1>Device {{.Action}}</h1>
  {{if eq .Action "approved"}}
  <p>The CLI should now have your token. You can close this window.</p>
  {{else}}
  <p>The pairing for <code>{{.UserCode}}</code> was denied.</p>
  {{end}}
  <p><a href="/inspector">Return to inspector</a></p>
</div>
</body>
</html>{{end}}
